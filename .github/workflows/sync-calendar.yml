name: Sync events from Google Calendar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Copy the public calendar into events.json
        run: python3 events/sync_calendar.py
      - name: Commit the updated events
        run: |
          git diff --quiet -- events/events.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events/events.json
          git commit -m "Update events from the calendar"
          git push
