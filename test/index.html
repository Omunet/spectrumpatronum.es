<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spectrum Patronum — Asociación cultural</title>
  <meta name="description" content="Associació Spectrum Patronum es una asociación cultural sin ánimo de lucro en Barcelona que promueve la música electrónica, la cultura DJ, la producción musical, la música en directo y las artes escénicas y visuales.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0710">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="assets/sp-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <style>html,body{background:#0B0710;color:#F3EEE6}</style>
  <script>
    try {
      var savedLang = localStorage.getItem("sp-lang");
      if (savedLang === "es" || savedLang === "ca" || savedLang === "en") {
        document.documentElement.lang = savedLang;
      }
    } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <a class="skip" href="#contenido" data-i18n="skip">Saltar al contenido</a>
    <nav class="social" aria-label="Social">
      <ul>
        <li>
          <a href="https://www.instagram.com/spectrumpatronum.es" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <rect x="3.25" y="3.25" width="17.5" height="17.5" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
              <circle cx="12" cy="12" r="4.15" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
              <circle cx="17.35" cy="6.65" r="1.05" fill="currentColor"></circle>
            </svg>
          </a>
        </li>
      </ul>
    </nav>
    <div class="lang">
      <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-menu" aria-label="Elegir idioma" data-i18n-aria="lang.label">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
          <path d="M3.75 12h16.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          <path d="M12 3.75c2.35 2.55 3.55 5.35 3.55 8.25s-1.2 5.7-3.55 8.25c-2.35-2.55-3.55-5.35-3.55-8.25s1.2-5.7 3.55-8.25z" fill="none" stroke="currentColor" stroke-width="1.6"></path>
        </svg>
      </button>
      <ul class="lang-menu" id="lang-menu" role="listbox" aria-labelledby="lang-btn" hidden>
        <li role="none"><button type="button" role="option" lang="es" data-lang="es" aria-selected="true">Español</button></li>
        <li role="none"><button type="button" role="option" lang="ca" data-lang="ca" aria-selected="false">Català</button></li>
        <li role="none"><button type="button" role="option" lang="en" data-lang="en" aria-selected="false">English</button></li>
      </ul>
    </div>
  </header>

  <main id="contenido">
    <section class="hero" aria-labelledby="wordmark">
      <div id="proyectos" class="page-anchor"></div>
      <div id="eventos" class="page-anchor"></div>
      <div id="contacto" class="page-anchor"></div>
      <h1 class="lockup" id="wordmark" aria-label="Spectrum Patronum">
        <span class="brand" aria-hidden="true">
          <span class="word">
            <span class="letters"><span aria-hidden="true">S</span><span aria-hidden="true">p</span><span aria-hidden="true">e</span><span aria-hidden="true">c</span><span aria-hidden="true">t</span><span aria-hidden="true">r</span><span aria-hidden="true">u</span><span aria-hidden="true">m</span></span>
          </span>
          <span class="logo">
            <img class="logo-still" src="assets/sp-logo.svg" alt="" width="240" height="240">
            <video class="logo-motion" autoplay muted loop playsinline webkit-playsinline width="240" height="240" tabindex="-1">
              <source src="assets/sp-logo-heartbeat.mp4" type="video/mp4">
            </video>
          </span>
          <span class="word">
            <span class="letters"><span aria-hidden="true">P</span><span aria-hidden="true">a</span><span aria-hidden="true">t</span><span aria-hidden="true">r</span><span aria-hidden="true">o</span><span aria-hidden="true">n</span><span aria-hidden="true">u</span><span aria-hidden="true">m</span></span>
          </span>
        </span>
      </h1>
      <nav id="site-nav" aria-label="Navegación principal" data-i18n-aria="nav.label">
        <ul>
          <li><a href="#proyectos" data-i18n="nav.projects">Proyectos</a></li>
          <li><a href="#eventos" data-i18n="nav.events">Eventos</a></li>
          <li><a href="#contacto" data-i18n="nav.contact">Contacto</a></li>
        </ul>
      </nav>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-name">Associació Spectrum Patronum</p>
    <p data-i18n="footer.note">Asociación cultural sin ánimo de lucro · Barcelona</p>
    <p class="legal-links">
      <a href="privacidad.html" data-i18n="legal.privacy">Privacidad</a>
    </p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
