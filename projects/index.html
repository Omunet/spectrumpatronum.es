<!DOCTYPE html>

  <script>

      var savedLang = localStorage.getItem("sp-lang");
      if (savedLang === "es" || savedLang === "ca" || savedLang === "en") {
        document.documentElement.lang = savedLang;
      }
    } catch (e) {}
  </script>
</head>
<body>

    <nav class="social" aria-label="Social">

              <rect x="3.25" y="3.25" width="17.5" height="17.5" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
              <circle cx="12" cy="12" r="4.15" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
              <circle cx="17.35" cy="6.65" r="1.05" fill="currentColor"></circle>
            </svg>
          </a>
        </li>
      </ul>
    </nav>
    <nav class="icon-nav" aria-label="Menú" data-i18n-aria="icon.nav">
      <ul>
        <li>
          <a href="/" data-i18n-aria="icon.home" data-i18n-title="icon.home" aria-label="Inicio" title="Inicio">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">

            </svg>
          </a>
        </li>
        <li>
          <a href="/projects/" aria-current="page" data-i18n-aria="icon.projects" data-i18n-title="icon.projects" aria-label="Proyectos" title="Proyectos">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path d="M14.2 4.4 19.6 9.8 16.8 12.6 11.4 7.2 14.2 4.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>
              <path d="M11.1 7.5 5.4 13.2a2 2 0 0 0 0 2.8l.3.3M7.6 15.4 4.2 18.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
            </svg>

        <li>
          <a href="/events/" data-i18n-aria="icon.events" data-i18n-title="icon.events" aria-label="Eventos" title="Eventos">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <rect x="4" y="5.5" width="16" height="14.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
              <path d="M4 10h16M8 3.5v4M16 3.5v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
            </svg>

        </li>

            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path d="M8 4.2h2.1l1.1 2.9-1.5 1a11.2 11.2 0 0 0 5.2 5.2l1-1.5 2.9 1.1v2.1c0 .7-.5 1.3-1.2 1.4A14.4 14.4 0 0 1 6.6 5.4c.1-.7.7-1.2 1.4-1.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path>

    <div class="lang">
      <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-menu" aria-label="Elegir idioma" data-i18n-aria="lang.label">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
          <path d="M3.75 12h16.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
          <path d="M12 3.75c2.35 2.55 3.55 5.35 3.55 8.25s-1.2 5.7-3.55 8.25c-2.35-2.55-3.55-5.35-3.55-8.25s1.2-5.7 3.55-8.25z" fill="none" stroke="currentColor" stroke-width="1.6"></path>
        </svg>
      </button>
      <ul class="lang-menu" id="lang-menu" role="listbox" aria-labelledby="lang-btn" hidden>
        <li role="none"><button type="button" role="option" lang="es" data-lang="es" aria-selected="true">Español</button></li>
        <li role="none"><button type="button" role="option" lang="ca" data-lang="ca" aria-selected="false">Català</button></li>
        <li role="none"><button type="button" role="option" lang="en" data-lang="en" aria-selected="false">English</button></li>
      </ul>
    </div>
  </header>

  <main class="projects-page" id="contenido">
    <p class="legal-home"><a href="/">Spectrum Patronum</a></p>
    <h1 id="projects-heading">Proyectos</h1>
    <noscript><p class="project-fallback">Activa JavaScript para ver los proyectos.</p></noscript>
    <ul class="project-grid" id="project-grid" aria-labelledby="projects-heading"></ul>
  </main>

  <footer class="site-footer">
    <p class="footer-name">Associació Spectrum Patronum</p>
    <p data-i18n="footer.note">Asociación cultural sin ánimo de lucro · Barcelona</p>
    <p class="legal-links">
      <a href="/privacidad.html" data-i18n="legal.privacy">Privacidad</a>
    </p>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    /* Projects grid.
       Add a project by appending an object to PROJECTS:
         { name: "Name", href: "https://example.com",
           logo: "/assets/projects/example.jpg", alt: "Description of the logo" }
       href must be an https URL. The tile opens it in a new tab.
       A placeholder is { placeholder: true }. Replace that object when the
       real name, logo and link are ready. Placeholder names follow
       the language chosen on the site. */
    (function () {
      "use strict";

      var PROJECTS = [
        {
          name: "Archmaje",
          href: "https://archmaje.com",
          logo: "/assets/projects/archmaje.jpg",
          alt: "Hooded cat at a DJ mixer, with a reflected cat and the word MAJE"
        },
        {
          name: "Blonde Brunette",
          href: "https://blondebrunette.music",
          logo: "/assets/projects/blonde-brunette.jpg",
          alt: "Pink halftone open mouth with the words BLONDE BRUNETTE in cyan"
        },
        {
          name: "Setlist.ID",
          href: "https://setlist.id",
          logo: "/assets/projects/setlist-id.jpg",
          alt: "Setlist.ID logo: an orange equalizer icon and the word SETLIST.ID"
        },
        { placeholder: true },
        { placeholder: true },
        { placeholder: true },
        { placeholder: true },
        { placeholder: true }
      ];

      var COPY = {
        es: {
          title: "Proyectos — Spectrum Patronum",
          description: "Proyectos de Associació Spectrum Patronum.",
          heading: "Proyectos",
          placeholderName: "Nombre del proyecto",
          placeholderAlt: "Logotipo provisional",
          newTab: "Se abre en una pestaña nueva"
        },
        ca: {
          title: "Projectes — Spectrum Patronum",
          description: "Projectes de l'Associació Spectrum Patronum.",
          heading: "Projectes",
          placeholderName: "Nom del projecte",
          placeholderAlt: "Logotip provisional",
          newTab: "S'obre en una pestanya nova"
        },
        en: {
          title: "Projects — Spectrum Patronum",
          description: "Projects of Associació Spectrum Patronum.",
          heading: "Projects",
          placeholderName: "Project name",
          placeholderAlt: "Placeholder logo",
          newTab: "Opens in a new tab"
        }
      };

      var grid = document.getElementById("project-grid");
      var heading = document.getElementById("projects-heading");
      var desc = document.querySelector('meta[name="description"]');

      function esc(value) {
        return String(value).replace(/[&<>"']/g, function (ch) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
        });
      }

      function langNow() {
        var lang = document.documentElement.lang;
        return COPY[lang] ? lang : "es";
      }

      function render() {
        var copy = COPY[langNow()];
        document.title = copy.title;
        if (desc) desc.setAttribute("content", copy.description);
        if (heading) heading.textContent = copy.heading;
        var html = "";
        PROJECTS.forEach(function (project) {
          var placeholder = !!project.placeholder;
          var name = placeholder ? (project.name || copy.placeholderName) : project.name;
          var alt = placeholder ? (project.alt || copy.placeholderAlt) : project.alt;
          var logo = project.logo || "/assets/projects/placeholder.svg";
          var mark = placeholder && !project.logo;
          var img = '<img src="' + esc(logo) + '" alt="' + esc(alt) + '" width="' +
            (mark ? "80" : "960") + '" height="' + (mark ? "80" : "960") + '"' +
            (mark ? ' class="project-mark"' : "") + ">";
          var body = '<span class="project-logo">' + img + "</span>" +
            '<span class="project-copy"><span class="project-name">' + esc(name) + "</span></span>";
          var href = typeof project.href === "string" ? project.href : "";
          if (!placeholder && href.indexOf("https://") === 0) {
            html += '<li><a class="project-tile" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' +
              body + '<span class="visually-hidden"> (' + esc(copy.newTab) + ")</span></a></li>";
          } else {
            html += '<li><div class="project-tile is-placeholder">' + body + "</div></li>";
          }
        });
        grid.innerHTML = html;
      }

      render();
      new MutationObserver(render).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["lang"]
      });
    })();
  </script>
</body>
</html>
